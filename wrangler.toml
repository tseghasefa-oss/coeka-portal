name = "coeka-portal"
main = "src/api/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Static Assets (React SPA output)
assets = { directory = "./dist", not_found_handling = "single-page-application" }

workers_dev = true

# Route mappings for COEKA (uncomment once coekatsinaala.edu.ng is active in Cloudflare)
# routes = [
#   { pattern = "portal.coekatsinaala.edu.ng/*", zone_name = "coekatsinaala.edu.ng" }
# ]

# 1. Cloudflare D1 SQL Database Binding
[[d1_databases]]
binding = "DB"
database_name = "coeka-production-db"
database_id = "52040074-37c6-4b74-9b05-e873fe5e181d"
migrations_dir = "src/database/migrations-drizzle"

# 2. Cloudflare KV Bindings
[[kv_namespaces]]
binding = "SESSION_KV"
id = "8f5649f5ff474989b6258d053c17fe93"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "d2e6170ab1fb4f8bb8b7cf083e41a852"

# 3. Cloudflare R2 Object Storage Binding
[[r2_buckets]]
binding = "DOCUMENTS_BUCKET"
bucket_name = "coeka-document-lake"

# 4. Cloudflare Queue Producer/Consumer Bindings
[[queues.producers]]
queue = "coeka-async-queue"
binding = "ASYNC_QUEUE"

[[queues.consumers]]
queue = "coeka-async-queue"
max_batch_size = 20
max_batch_timeout = 10
max_retries = 5

[triggers]
crons = ["*/15 * * * *", "0 1 * * *"]
