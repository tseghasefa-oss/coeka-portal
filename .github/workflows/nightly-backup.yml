name: COEKA Automated Disaster Recovery & Nightly Database Backup

on:
  schedule:
    # Runs every night at 02:00 AM UTC (03:00 AM West Africa Time)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual backup trigger reason'
        required: false
        default: 'Routine on-demand snapshot'

concurrency:
  group: d1-nightly-backup
  cancel-in-progress: false

jobs:
  backup-and-vault:
    name: "Export, Encrypt & Vault D1 Database"
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2505509c9d45ab58888c430de12d58c8' }}
      BACKUP_KEY: ${{ secrets.LEDGER_SIGNING_SECRET || secrets.JWT_SECRET || 'coeka-institutional-vault-default-key-2026' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Create Backup Workspace & Generate Timestamps
        id: meta
        run: |
          mkdir -p backups
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%SZ")
          DATE_TAG=$(date -u +"%Y-%m-%d")
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "date_tag=$DATE_TAG" >> $GITHUB_OUTPUT
          echo "filename=coeka_d1_backup_${TIMESTAMP}.sql" >> $GITHUB_OUTPUT

      - name: Export Live D1 Production Database
        run: |
          echo "Initiating live export of coeka-production-db..."
          npx wrangler d1 export coeka-production-db --remote --output="backups/${{ steps.meta.outputs.filename }}"
          
          # Verify backup is not empty
          if [ ! -s "backups/${{ steps.meta.outputs.filename }}" ]; then
            echo "ERROR: Exported SQL backup is empty or failed to generate!"
            exit 1
          fi
          
          RAW_SIZE=$(stat -c%s "backups/${{ steps.meta.outputs.filename }}")
          echo "raw_size=$RAW_SIZE" >> $GITHUB_ENV
          echo "Successfully exported database. Raw SQL size: $RAW_SIZE bytes."

      - name: Cryptographically Encrypt SQL Dump (AES-256-CBC)
        run: |
          echo "Encrypting SQL backup with AES-256-CBC using PBKDF2 key derivation..."
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in "backups/${{ steps.meta.outputs.filename }}" \
            -out "backups/${{ steps.meta.outputs.filename }}.enc" \
            -pass env:BACKUP_KEY

          CHECKSUM=$(sha256sum "backups/${{ steps.meta.outputs.filename }}.enc" | awk '{print $1}')
          ENC_SIZE=$(stat -c%s "backups/${{ steps.meta.outputs.filename }}.enc")
          echo "checksum=$CHECKSUM" >> $GITHUB_ENV
          echo "enc_size=$ENC_SIZE" >> $GITHUB_ENV
          echo "Encrypted backup size: $ENC_SIZE bytes. SHA-256 Checksum: $CHECKSUM"

      - name: Upload Encrypted Snapshot to Primary R2 Backup Vault
        run: |
          echo "Uploading encrypted snapshot to R2 bucket coeka-document-lake..."
          R2_TARGET="coeka-document-lake/backups/d1/${{ steps.meta.outputs.date_tag }}/${{ steps.meta.outputs.filename }}.enc"
          npx wrangler r2 object put "$R2_TARGET" --file="backups/${{ steps.meta.outputs.filename }}.enc" --content-type="application/octet-stream"

          # Also update latest pointer for instant disaster recovery
          LATEST_POINTER="coeka-document-lake/backups/d1/latest.sql.enc"
          npx wrangler r2 object put "$LATEST_POINTER" --file="backups/${{ steps.meta.outputs.filename }}.enc" --content-type="application/octet-stream"
          echo "R2 upload complete."

      - name: Upload Backup Artifact to GitHub Actions Storage (14-Day Redundancy)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.filename }}.enc
          path: backups/${{ steps.meta.outputs.filename }}.enc
          retention-days: 14
          if-no-files-found: error

      - name: Generate Audit Runbook Summary
        if: always()
        run: |
          echo "### 🛡️ COEKA Automated Database Backup Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Database:** \`coeka-production-db (52040074-37c6-4b74-9b05-e873fe5e181d)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp (UTC):** \`${{ steps.meta.outputs.timestamp }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Raw SQL Dump:** \`${{ steps.meta.outputs.filename }}\` (\`${{ env.raw_size }} bytes\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Cipher:** \`AES-256-CBC (PBKDF2 salted)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Encrypted File:** \`${{ steps.meta.outputs.filename }}.enc\` (\`${{ env.enc_size }} bytes\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256 Checksum:** \`${{ env.checksum }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **R2 Storage Path:** \`coeka-document-lake/backups/d1/${{ steps.meta.outputs.date_tag }}/${{ steps.meta.outputs.filename }}.enc\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest Recovery Target:** \`coeka-document-lake/backups/d1/latest.sql.enc\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Immutable Backup Vaulted Successfully ✅" >> $GITHUB_STEP_SUMMARY
